slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan       # El robot solo publica en /scan_raw, es necesario hacer un relay
    mode: mapping

    # para que no se pierda al girar
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Para que ignore micromovimientos y actualice cuando el giro es seguro
    minimum_travel_heading: 0.25
    minimum_travel_distance: 0.1

    # Para intentar evitar que acepte paredes dobles cuando gira rápido. Tiene que tener mas de un 50% de seguridad
    link_match_minimum_response_fine: 0.5  
    
    # Si derrapa busca la pared en un área de 3 metros para que se reubique
    correlation_search_space_dimension: 3.0  
    correlation_search_space_resolution: 0.05
    correlation_search_space_smear_deviation: 0.1 
    
    do_loop_closing: true
    loop_search_maximum_distance: 20.0
    loop_match_minimum_chain_size: 1
    
    loop_match_maximum_variance_coarse: 9.0  
    loop_match_minimum_response_coarse: 0.20 
    loop_match_minimum_response_fine: 0.20

    # config del laser
    max_laser_range: 20.0
    resolution: 0.05
    
    # motor matemático
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
