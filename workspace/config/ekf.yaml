ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: false      # ¡MUY IMPORTANTE! Lo dejamos en false para no pelear con el controlador base de TIAGo.
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 1. RUEDAS: Cogemos de aquí solo la velocidad de ir hacia adelante y atrás
    odom0: /mobile_base_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,   # X_vel, Y_vel
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    # 2. IMU (GIROSCOPIO): Cogemos de aquí toda la rotación, ignorando a las ruedas
    imu0: /base_imu
    imu0_config: [false, false, false,
                  false, false, true,     # Yaw (Ángulo Z)
                  false, false, false,
                  false, false, true,     # Yaw Velocity (Velocidad de giro)
                  false, false, false]
    imu0_queue_size: 10
