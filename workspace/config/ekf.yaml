ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true      # False para no pelear con el controlador base de TIAGo
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # RUEDAS Obtiene la velocidad de ir hacia adelante y atrás, no los laterales
    odom0: /mobile_base_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,   # solo X_vel para velocidad frontal
                   false, false, false,
                   false, false, true]    # Yaw Vel para giro de las ruedas, ayuda si la IMU falla
    odom0_queue_size: 10

    # IMU Obtener toda la rotación del giroscopio, ignorando a las ruedas
    imu0: /base_imu
    imu0_config: [false, false, false,
                  false, false, false,    
                  false, false, false,
                  false, false, true,     # solo velocidad de giro del giroscopio
                  false, false, false]
    imu0_queue_size: 10
